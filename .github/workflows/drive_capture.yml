name: Captura CelesTrak a GitHub Artifacts

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  descargar-y-guardar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar datos de CelesTrak
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S_UTC")
          FILENAME="celestrak_active_${TIMESTAMP}.json"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          curl -s -A "Mozilla/5.0 (DataCapture/1.0)" -o $FILENAME "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json"

      - name: Subir a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: captura-${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 90
